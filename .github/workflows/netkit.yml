name: netkit

# SHANKPIT Netkit's logic (stdlib/netkit/*.prn: scanner, VNC/RFB, DES, SSH) compiled to wasm32 and tested on every
# change (also: SSH against asyncssh AND the real OpenSSH sshd, run unprivileged with libnss_wrapper). Same promises as the other web games: zero imports, no allocator, no memory.grow, fixed memory -- the build
# script refuses otherwise. The RFB client is also tested against a REAL VNC server (libvncserver, TightVNC's lineage).
#
# Toolchain wiring is the one the scripts expect (apt llvm-18 + lld-18 under LLVM_TOOLCHAIN_ROOT), as trapx-wasm.yml.

on:
  push:
    branches: [main]
    paths:
      - 'stdlib/netkit/**'
      - 'tests/netkit/**'
      - 'scripts/build_netkit_wasm.sh'
      - 'scripts/build_netkit_term_wasm.sh'
      - 'scripts/build_netkit_web.sh'
      - 'scripts/test_netkit.sh'
      - '.github/workflows/netkit.yml'
  pull_request:
    paths:
      - 'stdlib/netkit/**'
      - 'tests/netkit/**'
      - 'scripts/build_netkit_wasm.sh'
      - 'scripts/test_netkit.sh'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  netkit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # the page's markup lives with the app (SHANKPIT/apps/netkit/index.html); the end-to-end test checks every id the generated JS uses
      - uses: actions/checkout@v4
        with:
          repository: emilyspringerton/SHANKPIT
          path: shankpit
          sparse-checkout: apps/netkit

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install LLVM 18 + lld, libvncserver, python deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-18 lld-18 libvncserver-dev openssh-server libnss-wrapper
          sudo mkdir -p /opt/llvm-toolchain/usr/lib/llvm-18
          sudo ln -sfn /usr/lib/llvm-18/bin /opt/llvm-toolchain/usr/lib/llvm-18/bin
          python3 -m pip install --user wasmtime pycryptodome cryptography asyncssh pyte playwright aiohttp
          python3 -m playwright install --with-deps chromium

      - name: Build and test (DES, RFB scripted, RFB vs a real VNC server)
        env:
          LLVM_TOOLCHAIN_ROOT: /opt/llvm-toolchain
        run: |
          set -euo pipefail
          make .parena-bootstrap
          NETKIT_SHOTS=build/screenshots NETKIT_INDEX_HTML=shankpit/apps/netkit/index.html scripts/test_netkit.sh 2>&1 | tee netkit-test.log
          ! grep -E '^FAIL|SKIP' netkit-test.log

      - name: Build the page bundle (wasm modules + generated JS)
        env:
          LLVM_TOOLCHAIN_ROOT: /opt/llvm-toolchain
        run: |
          set -euo pipefail
          scripts/build_netkit_web.sh build/web
          {
            echo "### Netkit page bundle"
            for f in build/web/*; do echo "- $(basename "$f"): $(wc -c < "$f") bytes, sha256 $(sha256sum "$f" | cut -d' ' -f1)"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: netkit-web
          path: build/web

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netkit-screenshots
          path: build/screenshots
          if-no-files-found: ignore
