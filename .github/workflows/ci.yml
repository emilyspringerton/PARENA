name: PARENA CI

on:
  push:
  pull_request:

# contents: write -- needed by the release job below (creating a git tag
# + a GitHub Release). Everything else in this workflow only ever reads;
# the build_editor_windows/build_editor_macos jobs below scope themselves
# down to contents: read explicitly.
permissions:
  contents: write

jobs:
  build_and_test:
    name: Build, Test & Sanitize (Bazel)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # SDL2/SDL2_ttf dev headers -- runtime/parena_runtime.h unconditionally
      # includes <SDL2/SDL.h>/<SDL2/SDL_ttf.h> (stdlib/sdl2.prn is "built in,
      # same tier as core" per STDLIB.md's own design intent, so every build
      # of this runtime needs them, not just ones that happen to call into
      # sdl2.prn). Found for real, not assumed: this step was missing and CI
      # broke with a real "fatal error: SDL2/SDL.h: No such file or
      # directory" the moment runtime/parena_runtime.h started including it
      # (2026-08-26) -- the dev box that change was verified on already had
      # libsdl2-dev/libsdl2-ttf-dev installed, this runner didn't. Same real
      # "apt is normal here" precedent as the Valgrind install step below.
      - name: Install SDL2 + SDL2_ttf dev headers (CI runner, not the interactive dev sandbox -- apt is normal here)
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev

      - name: Build (bazel build //... — global -std=c99 -Wall -Wextra -pedantic
          via .bazelrc, matching VS0 DoD's own C-emitter bar)
        run: bazel build //...

      - name: Test (DoD domain 1 — balanced + imbalanced S-expression unit tests)
        run: bazel test //tests:test_lexer_parser --test_output=all

      - name: Test (DoD domain 2 — region analyzer, 1 positive + 1 negative case)
        run: bazel test //tests:test_region --test_output=all

      - name: Test (DoD domain 3 — C emitter)
        run: bazel test //tests:test_emit --test_output=all

      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: |
          bazel test --config=asan //tests:test_lexer_parser --test_output=all
          bazel test --config=asan //tests:test_region --test_output=all
          bazel test --config=asan //tests:test_emit --test_output=all

      - name: CLI smoke test against the real VS0 test.prn from NORTHSTAR.md
        run: |
          set -euo pipefail
          bazel run //src:parena -- parse "$(pwd)/examples/test.prn"
          # test.prn's own break-safety function is a real, deliberately
          # invalid escape (NORTHSTAR.md's own negative DoD case) -- expect
          # exit 1, not success, from the analyzer.
          if bazel run //src:parena -- analyze "$(pwd)/examples/test.prn"; then
            echo "expected analyze to reject test.prn's break-safety, but it exited 0" >&2
            exit 1
          fi

      - name: CLI smoke test — domain 3 end-to-end (parse -> analyze -> emit -> real gcc compile)
        run: |
          set -euo pipefail
          bazel run //src:parena -- build "$(pwd)/examples/valid_only.prn" -o "$(pwd)/dist_valid_only.c"
          # The DoD's own literal acceptance bar: "gcc -Wall -Wextra
          # -pedantic -std=c99 zero warnings" on the emitted C, not just
          # "parena itself didn't crash."
          gcc -std=c99 -Wall -Wextra -pedantic -Werror -I runtime -c \
            -o "$(pwd)/dist_valid_only.o" "$(pwd)/dist_valid_only.c"

      - name: Install Valgrind (CI runner, not the interactive dev sandbox -- apt is normal here)
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Domain 4 — memory verification (runs the real emitted program under ASan+UBSan and
          Valgrind; also confirms a deliberately-broken fixture actually gets caught)
        run: |
          set -euo pipefail
          make build
          make test-domain4

      - name: "Domain 5 — CLI runner (the DoD's own literal bar: exit 0 + real output on success,
          exit 1 + no stale output on a real region-safety violation)"
        run: |
          set -euo pipefail
          make build
          make test-domain5

      - name: "Multi-file build (parena build a.prn b.prn -o out.c real cross-file resolution)"
        run: |
          set -euo pipefail
          make build
          make test-multifile

      # Self-hosting effort (NORTHSTAR.md's own "Self-hosting" section):
      # selfhost/lexer.prn -> parser.prn -> region.prn -> emit.prn, a real
      # PARENA-language port of VS0's own lexer/parser/region-analyzer/
      # C-emitter. Real, honest gap this closes (first flagged in the
      # v0.88.0 Apple): these had only ever been verified on this
      # contributor's own dev box, never a real, official CI run.
      - name: "Self-hosting domain 1 — lexer.prn (real port of src/lexer.c)"
        run: |
          set -euo pipefail
          make build
          make test-selfhost-lexer

      - name: "Self-hosting domain 2 — parser.prn (real port of src/parser.c)"
        run: |
          set -euo pipefail
          make build
          make test-selfhost-parser

      - name: "Self-hosting domain 3 — region.prn (real port of src/region.c)"
        run: |
          set -euo pipefail
          make build
          make test-selfhost-region

      # test-selfhost-emit shells out to gcc via system() to compile+
      # link+run its own generated C (see tests/test_selfhost_emit.c's
      # own header comment) -- a real, genuinely different verification
      # shape from the other 3 selfhost tests, kept as its own separate
      # step so a real failure there is immediately attributable.
      - name: "Self-hosting domain 4 — emit.prn (real port of src/emit.c, real compile+run proof)"
        run: |
          set -euo pipefail
          make build
          make test-selfhost-emit

      # test-selfhost-main is a real disk-to-disk pipeline test (build-file
      # itself reads examples/valid_only.prn and writes a real output C
      # file, both real file I/O, not in-memory strings the test harness
      # passes around) -- same real compile+link+run verification shape
      # domain 4 already established, now exercised through build-file's
      # own real file-open/read-string/write-string/file-close calls
      # instead of this test doing that work itself.
      - name: "Self-hosting domain 5 — main.prn (real port of src/main.c's cmd_build, real disk-to-disk pipeline)"
        run: |
          set -euo pipefail
          make build
          make test-selfhost-main

      # test-editor-spotlight is pure logic (no SDL2/Xvfb needed -- see
      # tests/test_editor_spotlight.c's own header comment), so it's cheap
      # to run right here rather than needing the Xvfb-dependent
      # editor-demo-smoke job's own setup.
      - name: "Spotlight (Ctrl+T/Cmd+T command palette) — provider registry, file search + calculator"
        run: |
          set -euo pipefail
          make build
          make test-editor-spotlight

      # Founder real-time: "where are the build artifacts?" / "wheres my
      # compiler." Every other repo in this monorepo's CI (PITVIPER,
      # GoblinFoxDragon, BRAWLPIT, SHANKPIT) uploads its built binary via
      # actions/upload-artifact -- this repo's own CI built the compiler on
      # every run and then just discarded it. bazel-bin/src/parena is a
      # symlink into Bazel's own output tree, which upload-artifact doesn't
      # follow reliably, so this copies the real file out first.
      - name: Stage compiler binary for upload
        run: |
          set -euo pipefail
          mkdir -p dist
          cp bazel-bin/src/parena dist/parena
          chmod +x dist/parena

      - name: Upload parena compiler binary
        uses: actions/upload-artifact@v4
        with:
          name: parena-${{ github.run_number }}-${{ github.sha }}
          path: dist/parena
          if-no-files-found: error

      # Founder real-time, 2026-08-26: "ensure editor binaries for windows
      # linux and mac are released in artifacts on parena on release" -- the
      # `parena` compiler itself only ever runs here (Linux, this job), so
      # the real per-platform work is generating editor-demo's own combined
      # C source ONCE here (same real "host driver concatenated onto the
      # generated .c" shape editor-demo's own Makefile target already
      # uses), then handing that one file to the build_editor_windows/
      # build_editor_macos jobs below to compile NATIVELY on their own real
      # runner -- matching PITVIPER's own real, proven precedent (its own
      # .github/workflows/ci.yml build_windows job) of a real per-OS
      # compile, not a cross-compile from Linux. This step itself doesn't
      # need runtime/parena_runtime.h's Windows-portability fix (Apple
      # #16235) -- it only runs the `parena` compiler, real C compilation
      # happens on each platform's own job below.
      - name: Generate editor-demo C source (compiled natively per-platform below)
        run: |
          set -euo pipefail
          ./dist/parena build stdlib/string.prn stdlib/array.prn stdlib/io.prn stdlib/regex/syntax.prn \
            stdlib/regex/pcre.prn stdlib/sdl2.prn stdlib/expr.prn \
            stdlib/editor/buffer.prn stdlib/editor/textmate.prn stdlib/editor/textmate_parena.prn \
            stdlib/editor/textmate_markdown.prn \
            stdlib/editor/theme.prn stdlib/editor/render.prn stdlib/editor/widget.prn \
            stdlib/editor/spotlight.prn -o editor_demo_gen.c
          cat editor_demo_gen.c examples/editor_main.c > editor_demo_full.c

      - name: Upload editor-demo generated C source (consumed by the Windows/macOS native-compile jobs)
        uses: actions/upload-artifact@v4
        with:
          name: editor-demo-src-${{ github.run_number }}-${{ github.sha }}
          path: editor_demo_full.c
          if-no-files-found: error

      # Real Linux editor-demo build + bundle, same real "bundle just the
      # SDL2-family .so files + patchelf RPATH" technique PITVIPER's own
      # ci.yml already established for its own pitviper binary -- the DoD's
      # own -Werror bar applies here too (editor-demo's own Makefile target
      # already builds it that way locally).
      - name: Install patchelf (for RPATH bundling below)
        run: sudo apt-get install -y patchelf

      - name: Build editor-demo (Linux)
        run: |
          set -euo pipefail
          # Real prnfmt-on-save bridge (2026-08-27, founder: "build
          # prnfmt into the editor so saving files auto formats them")
          # -- src/arena.c's own arena_init/arena_alloc/arena_strdup/
          # arena_free_all collide at LINK time with runtime/
          # parena_runtime.c's own identically-named functions once
          # both land in the same final editor-demo executable
          # (confirmed live via a real "multiple definition" linker
          # error) -- fixed the same real, standard way on every real
          # platform: recompile src/arena.c + src/fmt.c fresh with
          # these 4 symbols preprocessor-renamed, matching Makefile's
          # own real PRNFMT_RENAME.
          PRNFMT_RENAME="-Darena_init=pf_arena_init -Darena_alloc=pf_arena_alloc -Darena_strdup=pf_arena_strdup -Darena_free_all=pf_arena_free_all"
          gcc -std=c99 -Wall -Wextra -pedantic -Werror $PRNFMT_RENAME -c src/arena.c -o pf_arena.o
          gcc -std=c99 -Wall -Wextra -pedantic -Werror $PRNFMT_RENAME -c src/fmt.c -o pf_fmt.o
          gcc -std=c99 -Wall -Wextra -pedantic -Werror $PRNFMT_RENAME -I runtime -c runtime/prnfmt_bridge.c -o pf_bridge.o
          gcc -std=c99 -Wall -Wextra -pedantic -Werror -I runtime editor_demo_full.c runtime/parena_runtime.c \
            pf_bridge.o pf_arena.o pf_fmt.o \
            -o editor-demo -lSDL2 -lSDL2_ttf -lm

      - name: Bundle SDL2 runtime libraries for standalone distribution (Linux)
        run: |
          set -euo pipefail
          mkdir -p dist-editor-linux/lib
          cp editor-demo dist-editor-linux/
          cp /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0 dist-editor-linux/lib/
          cp /usr/lib/x86_64-linux-gnu/libSDL2_ttf-2.0.so.0 dist-editor-linux/lib/
          patchelf --set-rpath '$ORIGIN/lib' dist-editor-linux/editor-demo
          echo "RPATH set: $(patchelf --print-rpath dist-editor-linux/editor-demo)"
          # Real, confirmed-live bug (2026-08-26, founder actually running
          # a real Windows build): examples/editor_main.c's own
          # open_font_with_fallback looks for JetBrainsMono-Regular.ttf
          # relative to the CURRENT DIRECTORY first -- bundle the repo's
          # own vendored copy (assets/fonts/, Apache-2.0) right next to
          # the binary on every real platform, not just where it happens
          # to already be installed as a system package (this Linux
          # runner has it too, but a real release tarball shouldn't
          # depend on that).
          cp assets/fonts/JetBrainsMono-Regular.ttf dist-editor-linux/

      - name: Upload editor-demo (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: editor-demo-linux-${{ github.run_number }}-${{ github.sha }}
          path: dist-editor-linux/
          if-no-files-found: error

      # Real gap closed 2026-08-25 (S202-19): every other active repo with real CI
      # already had a *_CONSTRUCT.txt build artifact (a full concatenation of its
      # own source, matching emily.cli's own ci.yml "Generate Construct Bundle"
      # step) -- PARENA was one of 9 confirmed missing it (S202-18's audit).
      - name: Generate Construct Bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="PARENA_CONSTRUCT.txt"
          {
            echo "PARENA CONSTRUCT ${{ github.run_number }}"
            echo "commit: $GITHUB_SHA"
            echo "generated_utc: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
          } > "$OUT"

          while IFS= read -r relpath; do
            {
              echo "--- FILE START: ${relpath} ---"
              cat "${relpath}"
              echo
              echo "--- FILE END: ${relpath} ---"
              echo
            } >> "$OUT"
          done < <(
            find . \
              \( \
                -path './.git' \
                -o -path './bazel-*' \
                -o -path './dist' \
              \) -prune -o \
              -type f \
              \( \
                -name '*.c' -o -name '*.h' -o -name '*.prn' -o -name 'BUILD.bazel' -o \
                -name 'MODULE.bazel' -o -name '*.bazelrc' -o -name 'Makefile' -o \
                -name '*.md' -o -name '*.sh' -o -name '*.yml' -o -name '*.yaml' \
              \) \
              ! -name "$OUT" \
              -print | sed 's#^./##' | LC_ALL=C sort
          )

          test -s "$OUT"

      - name: Upload Construct Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PARENA_Construct_${{ github.run_number }}_${{ github.sha }}
          path: PARENA_CONSTRUCT.txt
          if-no-files-found: error

  # Real, native Windows compile of editor-demo, mirroring PITVIPER's own
  # real, proven build_windows job (.github/workflows/ci.yml): MSYS2/MinGW64
  # provides SDL2 + a matching gcc in one self-consistent toolchain, avoiding
  # the ABI mismatches of bolting a separate cross-compiler onto a native
  # setup-* toolchain. Only needs runtime/parena_runtime.h's real
  # -Wall -Wextra clean bar under mingw -- already verified by hand this
  # same session (Apple #16235) via the real x86_64-w64-mingw32-gcc
  # cross-compiler, before this job existed.
  build_editor_windows:
    name: Build Editor (Windows)
    runs-on: windows-latest
    needs: build_and_test
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf

      - name: Download editor-demo generated C source
        uses: actions/download-artifact@v4
        with:
          name: editor-demo-src-${{ github.run_number }}-${{ github.sha }}

      - name: Build editor-demo.exe
        run: |
          set -euo pipefail
          # -lmingw32 -lSDL2main -lSDL2 (that order): SDL2's own SDL_main.h
          # #defines main to SDL_main under _WIN32 -- SDL2main.a supplies
          # the real WinMain entry point that calls back into it. Without
          # this, link fails with a real "undefined reference to WinMain"
          # (confirmed live on a real windows-latest runner, 2026-08-26 --
          # this repo's own earlier mingw verification only ever checked
          # compilation, never the link stage, so this gap wasn't caught
          # until a real CI run hit it).
          #
          # -mwindows: real, confirmed-live bug, same founder Windows run
          # -- a plain MinGW build defaults to the CONSOLE subsystem, so a
          # real black CMD window opened alongside the real SDL window
          # every launch (part of what read as "2 black screens"). SDL2's
          # own official guidance for a release build is exactly this
          # flag -- switches to the GUI/windows subsystem, which SDL2main
          # (linked above) already expects. Real, honest tradeoff: this
          # repo's own fprintf(stderr, ...) diagnostics (save/load status,
          # startup failures) have nowhere to print without a console on
          # Windows -- a real, separate, deferred follow-up (e.g. a
          # MessageBox on real startup failure) would close that, not
          # attempted here.
          #
          # PRNFMT_RENAME: real prnfmt-on-save bridge, same real link-
          # level symbol collision fixed the same way on every real
          # platform -- see the Linux job's own identical comment above.
          PRNFMT_RENAME="-Darena_init=pf_arena_init -Darena_alloc=pf_arena_alloc -Darena_strdup=pf_arena_strdup -Darena_free_all=pf_arena_free_all"
          gcc -std=c99 -Wall -Wextra -Werror $PRNFMT_RENAME -c src/arena.c -o pf_arena.o
          gcc -std=c99 -Wall -Wextra -Werror $PRNFMT_RENAME -c src/fmt.c -o pf_fmt.o
          gcc -std=c99 -Wall -Wextra -Werror $PRNFMT_RENAME -I runtime -c runtime/prnfmt_bridge.c -o pf_bridge.o
          gcc -std=c99 -Wall -Wextra -Werror -mwindows -I runtime editor_demo_full.c runtime/parena_runtime.c \
            pf_bridge.o pf_arena.o pf_fmt.o \
            -o editor-demo.exe -lmingw32 -lSDL2main -lSDL2 -lSDL2_ttf -lm

      # Real, native Windows verification for 3 of the 4 self-hosting
      # domains (NORTHSTAR.md's own "Self-hosting" section) -- a real,
      # honest gap this closes (first flagged in the v0.88.0 Apple):
      # selfhost/lexer.prn/parser.prn/region.prn had only ever been
      # verified via a local mingw COMPILE-only check, never a real
      # link+run on an actual Windows runner. Compiles the ALREADY-
      # COMMITTED tests/test_selfhost_*_gen.c directly (these are real,
      # checked-in generated C, the same convention every other real
      # _gen.c file in this repo already follows) -- no `parena`
      # compiler binary needed on this runner at all, since this job
      # only ever compiles already-generated C natively. domain 4
      # (emit.prn) is deliberately NOT wired here: its own real test
      # shells out to gcc via system() to compile a FURTHER generated
      # program (see tests/test_selfhost_emit.c's own header comment),
      # a genuinely different, harder-to-verify-without-real-runner-
      # access shape -- a real, separate, deferred follow-up, not
      # silently skipped.
      - name: "Self-hosting domains 1-3 (lexer/parser/region) — real Windows link+run"
        run: |
          set -euo pipefail
          # Real, confirmed-live LINK error found by this exact step's own
          # first real CI run (2026-08-27): SDL_main.h's own real `#define
          # main SDL_main` (see the previous "conflicting types" fix, same
          # commit's own header comment) means the linker now expects a
          # real `WinMain` -- which SDL2main.a itself provides (it calls
          # back into SDL_main/main internally), but only if actually
          # linked. `-mwindows` deliberately NOT added here (unlike
          # editor-demo's own real build above): these are real CLI test
          # tools meant to be read from their own real stdout in the CI
          # log, not an interactive GUI app where hiding the console
          # window is the whole point.
          for name in lexer parser region; do
            gcc -std=c99 -Wall -Wextra -pedantic -Werror -I runtime -I tests \
              "tests/test_selfhost_${name}.c" runtime/parena_runtime.c \
              -o "test_selfhost_${name}.exe" -lmingw32 -lSDL2main -lSDL2 -lSDL2_ttf -lm
            "./test_selfhost_${name}.exe"
          done

      - name: Bundle with required DLLs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp editor-demo.exe dist/
          # SDL2.dll (and friends) are dynamically linked — ldd lists every
          # MSYS2-provided DLL the binary actually needs so the zip is
          # self-contained on a machine without MSYS2 installed. Same real
          # technique PITVIPER's own ci.yml bundle step already uses.
          for dll in $(ldd editor-demo.exe | grep -i '/mingw64/bin/' | awk '{print $3}'); do
            cp "$dll" dist/
          done
          # Real, confirmed-live bug: examples/editor_main.c's own
          # open_font_with_fallback needs JetBrainsMono-Regular.ttf next
          # to the binary -- see the Linux job's own identical comment.
          cp assets/fonts/JetBrainsMono-Regular.ttf dist/
          # RUN.bat -- founder real-time, actually testing this on a real
          # Windows machine: "its missing the batch file to run it". Same
          # real convention PITVIPER's own ci.yml already ships (a
          # zipped .exe with no obvious double-click entry point isn't a
          # real deliverable for a non-technical Windows user). `cd /d
          # %~dp0` first so the relative-path font lookup above actually
          # resolves regardless of where the zip was extracted to.
          printf '@echo off\r\ncd /d %%~dp0\r\neditor-demo.exe\r\n' > dist/RUN.bat

      - name: Upload editor-demo (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: editor-demo-windows-${{ github.run_number }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  # Real, native macOS compile of editor-demo. No PITVIPER precedent for
  # this platform (its own ci.yml only ever built Linux + Windows) -- new
  # for real here. Real, deliberate scope limit, not an oversight: unlike
  # the Linux/Windows jobs above, this does NOT bundle the Homebrew SDL2/
  # SDL2_ttf dylibs (would need install_name_tool rewriting + a real
  # per-arch matrix, since macos-latest's own real architecture has moved
  # under GitHub before) -- ships a real, working binary that expects
  # `brew install sdl2 sdl2_ttf` on the machine that runs it, same
  # "expand only once something real needs it" tradeoff this whole
  # stdlib's own host-glue work already carries elsewhere.
  build_editor_macos:
    name: Build Editor (macOS)
    runs-on: macos-latest
    needs: build_and_test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 + SDL2_ttf (Homebrew)
        run: brew install sdl2 sdl2_ttf

      - name: Download editor-demo generated C source
        uses: actions/download-artifact@v4
        with:
          name: editor-demo-src-${{ github.run_number }}-${{ github.sha }}

      - name: Build editor-demo
        run: |
          set -euo pipefail
          SDL2_PREFIX="$(brew --prefix sdl2)"
          SDL2_TTF_PREFIX="$(brew --prefix sdl2_ttf)"
          # Both <prefix>/include (so this repo's own runtime.h
          # `#include <SDL2/SDL.h>` resolves) AND <prefix>/include/SDL2
          # (so SDL_ttf.h's own internal unqualified `#include "SDL.h"`
          # resolves too) -- confirmed live on a real macos-latest runner,
          # 2026-08-26: the include/SDL2 form alone left SDL_ttf.h's own
          # include unresolved ("fatal error: 'SDL.h' file not found").
          # -Wno-parentheses-equality: the real, unguarded-match-result
          # -Wsometimes-uninitialized errors this same real CI run also
          # hit were a genuine emitter gap, fixed at the root in
          # src/emit.c (Apple filed same day). This one is different --
          # src/emit.c's expression emitter wraps every binary op in its
          # own parens for nested-precedence safety, which is correct and
          # necessary in general, but reads as `if ((x == y))` at the top
          # of a conditional -- redundant, harmless, and only Clang's own
          # -Wparentheses-equality (part of -Wall under Clang, not GCC)
          # flags it. Fixing that generally means touching every
          # conditional-emission call site in the emitter for zero
          # correctness benefit, so it's suppressed here rather than
          # "fixed" -- a real, deliberate, Clang-only cosmetic carve-out,
          # not a correctness concern like the uninitialized-var case was.
          # PRNFMT_RENAME: real prnfmt-on-save bridge, same real link-
          # level symbol collision fixed the same way on every real
          # platform -- see the Linux job's own identical comment.
          PRNFMT_RENAME="-Darena_init=pf_arena_init -Darena_alloc=pf_arena_alloc -Darena_strdup=pf_arena_strdup -Darena_free_all=pf_arena_free_all"
          cc -std=c99 -Wall -Wextra -Werror $PRNFMT_RENAME -c src/arena.c -o pf_arena.o
          cc -std=c99 -Wall -Wextra -Werror $PRNFMT_RENAME -c src/fmt.c -o pf_fmt.o
          cc -std=c99 -Wall -Wextra -Werror $PRNFMT_RENAME -I runtime -c runtime/prnfmt_bridge.c -o pf_bridge.o
          cc -std=c99 -Wall -Wextra -Werror -Wno-parentheses-equality -I runtime \
            -I "$SDL2_PREFIX/include" -I "$SDL2_PREFIX/include/SDL2" \
            -I "$SDL2_TTF_PREFIX/include" -I "$SDL2_TTF_PREFIX/include/SDL2" \
            editor_demo_full.c runtime/parena_runtime.c \
            pf_bridge.o pf_arena.o pf_fmt.o \
            -L"$SDL2_PREFIX/lib" -L"$SDL2_TTF_PREFIX/lib" -lSDL2 -lSDL2_ttf -lm \
            -o editor-demo

      # Real, native macOS (real Clang, via `cc`) verification for 3 of
      # the 4 self-hosting domains -- same real gap + same real scope
      # limit as the Windows job's own identically-shaped step above
      # (see its own comment for the full real reasoning: domain 4/
      # emit.prn's own system()-based sub-compilation is deliberately
      # NOT wired here, a real, separate, deferred follow-up). Compiles
      # the ALREADY-COMMITTED tests/test_selfhost_*_gen.c directly --
      # no `parena` compiler binary needed on this runner. Only the
      # SDL2 header include paths are needed (parena_runtime.h
      # unconditionally includes <SDL2/SDL.h>), not the library link --
      # none of these tests ever call an actual SDL2 function.
      - name: "Self-hosting domains 1-3 (lexer/parser/region) — real macOS link+run"
        run: |
          set -euo pipefail
          SDL2_PREFIX="$(brew --prefix sdl2)"
          SDL2_TTF_PREFIX="$(brew --prefix sdl2_ttf)"
          for name in lexer parser region; do
            cc -std=c99 -Wall -Wextra -pedantic -Werror -Wno-parentheses-equality -I runtime -I tests \
              -I "$SDL2_PREFIX/include" -I "$SDL2_PREFIX/include/SDL2" \
              -I "$SDL2_TTF_PREFIX/include" -I "$SDL2_TTF_PREFIX/include/SDL2" \
              "tests/test_selfhost_${name}.c" runtime/parena_runtime.c \
              -o "test_selfhost_${name}" -lm
            "./test_selfhost_${name}"
          done

      - name: Bundle font + Homebrew dylibs for standalone distribution (macOS)
        run: |
          set -euo pipefail
          mkdir -p dist-editor-macos/lib
          cp editor-demo dist-editor-macos/
          # Real, confirmed-live bug: examples/editor_main.c's own
          # open_font_with_fallback needs JetBrainsMono-Regular.ttf next
          # to the binary -- see the Linux job's own identical comment.
          cp assets/fonts/JetBrainsMono-Regular.ttf dist-editor-macos/

          # Real dylib bundling (2026-08-27, founder: "continue working
          # on parena editor" -- closes the last of the 3 real platform
          # release builds that wasn't yet standalone; Linux already
          # bundles its own .so via patchelf, Windows its own .dll via
          # ldd, both earlier in this same file). Real, standard macOS
          # app-bundling technique: a fixed-point walk over otool -L's
          # own real dependency list, copying every real Homebrew-
          # provided dylib (SDL2/SDL2_ttf plus their OWN real transitive
          # deps -- SDL2_ttf itself depends on libfreetype, which
          # depends on libpng/zlib/etc, not just the 2 top-level libs)
          # into lib/, rewriting every real load command (both the
          # binary's own and each bundled dylib's own cross-references)
          # to a real @executable_path/lib/-relative path via
          # install_name_tool, until a full pass discovers nothing new.
          # Only /opt/homebrew or /usr/local paths are bundled -- real
          # macOS system libraries (/usr/lib, /System) are always
          # present on any real Mac and are deliberately left alone,
          # same real "don't bundle base-OS libraries" judgment
          # PITVIPER's own Linux .so-bundling step already documents.
          #
          # Deliberately NOT using bash arrays/associative-arrays for
          # the real fixed-point queue (an earlier draft did) -- macOS
          # runners can default to the real system /bin/bash (3.2, GPLv2
          # licensing, no `declare -A`, and empty-array expansion under
          # `set -u` is version-fragile even for plain arrays). Instead:
          # every outer pass re-scans the binary plus every file
          # currently in lib/, copying any newly-discovered real
          # Homebrew dep; repeats until a pass adds nothing -- portable
          # to any real POSIX-ish bash, no array features needed at all.
          # Idempotent by construction: once a dep is rewritten to
          # @executable_path/..., otool -L no longer reports it under
          # /opt/homebrew|/usr/local, so re-scanning an already-fixed
          # file is a real, harmless no-op.
          BINPATH="dist-editor-macos/editor-demo"
          LIBDIR="dist-editor-macos/lib"
          changed=1
          while [ "$changed" -eq 1 ]; do
            changed=0
            for current in "$BINPATH" "$LIBDIR"/*; do
              [ -f "$current" ] || continue
              deps="$(otool -L "$current" 2>/dev/null | tail -n +2 | awk '{print $1}' | grep -E '^(/opt/homebrew|/usr/local)/' || true)"
              for dep in $deps; do
                base="$(basename "$dep")"
                target="$LIBDIR/$base"
                if [ ! -f "$target" ]; then
                  cp "$dep" "$target"
                  chmod u+w "$target"
                  install_name_tool -id "@executable_path/lib/$base" "$target"
                  changed=1
                fi
                install_name_tool -change "$dep" "@executable_path/lib/$base" "$current"
              done
            done
          done
          # Real, ad-hoc (no Apple Developer certificate needed) re-sign
          # -- required for the binary to even LAUNCH on Apple Silicon:
          # rewriting load commands via install_name_tool invalidates
          # any existing signature, and arm64 macOS refuses to run a
          # binary with no signature at all (unlike Intel, which is more
          # lenient). This is NOT the same as real notarization/a signed
          # release (a genuinely separate, much bigger undertaking
          # needing a paid Apple Developer account) -- an unsigned-by-a-
          # real-identity binary will still show Gatekeeper's own
          # "unidentified developer" warning on first launch, a real,
          # separate, pre-existing limitation of any binary distributed
          # this way, not something this bundling step makes worse.
          for f in "$LIBDIR"/*; do
            if [ -f "$f" ]; then codesign --force --sign - "$f"; fi
          done
          codesign --force --sign - "$BINPATH"
          echo "Bundled dylibs:" && ls -lh "$LIBDIR"

      - name: Upload editor-demo (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: editor-demo-macos-${{ github.run_number }}-${{ github.sha }}
          path: dist-editor-macos/
          if-no-files-found: error

  # Founder real-time, 2026-08-21: "whenever a build passes release it
  # as a minor version" -> "like a . bump" -> "i will handle big bumps
  # to signify human verify releases" -> "start pushing the artifacts
  # to releases in github". Every green build on main auto-bumps the
  # MINOR version (X.Y.Z -> X.(Y+1).0) and cuts a real GitHub Release
  # with the compiler binary + every real per-platform editor-demo
  # bundle attached -- the MAJOR version (X) is deliberately left alone
  # here, reserved for the founder's own manual bump to mark a real,
  # human-verified release. Gated to push-to-main only (not PRs, not
  # other branches) so this doesn't flood the repo with a release per
  # feature-branch push; needs every build/test/compile job above to
  # have already passed on every real platform.
  #
  # Split into its own job (2026-08-26, founder: "ensure editor binaries
  # for windows linux and mac are released in artifacts on parena on
  # release") -- previously these steps ran inline at the end of
  # build_and_test, which only ever had the Linux compiler binary to
  # attach; a real release now needs the Windows/macOS jobs' own
  # artifacts too, which don't exist until those jobs finish.
  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [build_and_test, build_editor_windows, build_editor_macos]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 -- this job needs the full tag history to find the
      # current version; actions/checkout's own default is a shallow clone
      # that doesn't reliably include tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download parena compiler binary
        uses: actions/download-artifact@v4
        with:
          name: parena-${{ github.run_number }}-${{ github.sha }}
          path: dist

      - name: Download editor-demo (Linux)
        uses: actions/download-artifact@v4
        with:
          name: editor-demo-linux-${{ github.run_number }}-${{ github.sha }}
          path: dist-editor/linux

      - name: Download editor-demo (Windows)
        uses: actions/download-artifact@v4
        with:
          name: editor-demo-windows-${{ github.run_number }}-${{ github.sha }}
          path: dist-editor/windows

      - name: Download editor-demo (macOS)
        uses: actions/download-artifact@v4
        with:
          name: editor-demo-macos-${{ github.run_number }}-${{ github.sha }}
          path: dist-editor/macos

      - name: Package release assets
        run: |
          set -euo pipefail
          chmod +x dist/parena
          chmod +x dist-editor/linux/editor-demo
          chmod +x dist-editor/macos/editor-demo
          # Linux/macOS: real tar.gz. Both include a real bundled lib/
          # dir (Linux via patchelf/RPATH, macOS via otool/
          # install_name_tool/codesign -- see each platform's own real
          # bundling step earlier in this file) and the bundled
          # JetBrainsMono-Regular.ttf font (real, confirmed-live bug
          # fix, 2026-08-26 -- see examples/editor_main.c's own
          # open_font_with_fallback header comment).
          tar -czf editor-demo-linux-x86_64.tar.gz -C dist-editor/linux editor-demo lib JetBrainsMono-Regular.ttf
          tar -czf editor-demo-macos.tar.gz -C dist-editor/macos editor-demo lib JetBrainsMono-Regular.ttf
          (cd dist-editor/windows && zip -r ../../editor-demo-windows-x86_64.zip .)

      - name: Compute next minor version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            major=0
            minor=0
          else
            ver="${latest#v}"
            major="$(echo "$ver" | cut -d. -f1)"
            minor="$(echo "$ver" | cut -d. -f2)"
          fi
          next_minor=$((minor + 1))
          next="v${major}.${next_minor}.0"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          # Regular (not --prerelease) as of 2026-08-26 -- founder
          # real-time: "move parena from pre release releases to regular
          # releases on auto releases". Previously --prerelease per an
          # earlier founder call (2026-08-21, "PARENA is pre release for
          # now" -- VS0 was still early, pre-1.0 compiler development);
          # superseded by this later, explicit direction.
          gh release create "$NEXT_VERSION" \
            dist/parena \
            editor-demo-linux-x86_64.tar.gz \
            editor-demo-windows-x86_64.zip \
            editor-demo-macos.tar.gz \
            --title "$NEXT_VERSION" \
            --generate-notes
