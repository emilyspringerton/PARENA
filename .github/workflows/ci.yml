name: PARENA CI

on:
  push:
  pull_request:

jobs:
  build_and_test:
    name: Build, Test & Sanitize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (matches VS0 DoD's own gcc -Wall -Wextra -pedantic -std=c99 bar)
        run: make build

      - name: Test (DoD domain 1 — balanced + imbalanced S-expression unit tests)
        run: make test

      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: |
          set -euo pipefail
          gcc -std=c99 -Wall -Wextra -pedantic -g -fsanitize=address,undefined \
            -o /tmp/parena_test_asan tests/test_lexer_parser.c src/arena.c src/ast.c src/lexer.c src/parser.c
          /tmp/parena_test_asan

      - name: CLI smoke test against the real VS0 test.prn from NORTHSTAR.md
        run: |
          set -euo pipefail
          ./parena parse examples/test.prn
