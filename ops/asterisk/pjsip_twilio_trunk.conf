; pjsip_twilio_trunk.conf — Twilio Elastic SIP Trunk. Auth: IP ACL only for v0
; (docs/SIP_TWILIO_GATEWAY_NORTHSTAR.md's own recommended choice — this box's own public IP is
; real and static: 198.58.107.85, confirmed live via `curl ifconfig.me`/`icanhazip.com` this
; session, 2026-09-05). Twilio's own Console requires "IP Access Control Lists and/or Credential
; Lists" (their own docs' own wording, real OR) — IP ACL alone satisfies that with zero PARENA/
; crypto work; Twilio's own official Asterisk configuration guide demonstrates provisioning BOTH
; schemes for extra redundancy, which is real, optional, easy future hardening (see the
; commented-out Credential List block at the bottom) if this box's IP ever needs to be able to
; change without a matching Twilio ACL update, not required to place/receive real calls today.
;
; REAL, FILL-IN-ONCE-YOU-HAVE-A-TWILIO-ACCOUNT PLACEHOLDER:
;   __TWILIO_TRUNK_DOMAIN__ -- your Trunk's own real Termination SIP URI host, e.g.
;   "yourtrunkname.pstn.twilio.com" (Twilio Console -> Elastic SIP Trunking -> your Trunk ->
;   Termination -> the domain it assigns you when you set a Termination SIP URI).
; See docs/TWILIO_SETUP_CHECKLIST.md for the exact, real Twilio Console steps.

[twilio-aor]
type=aor
contact=sip:__TWILIO_TRUNK_DOMAIN__:5060
; qualify_frequency: real, periodic OPTIONS ping against a static (non-registering) contact --
; same real liveness-detection reasoning as pjsip_carepyre_phone.conf's own AOR, and matches
; Twilio's own official Asterisk guide's trunk_defaults (`aor/qualify_frequency = 60`).
qualify_frequency=60

[twilio-endpoint]
type=endpoint
context=from-twilio
disallow=all
; ulaw first -- Twilio's own recommended trunking codec (docs/SIP_TWILIO_GATEWAY_NORTHSTAR.md's
; own already-researched finding); matches Twilio's own official guide's own `allow = !all,ulaw`.
allow=ulaw,alaw
aors=twilio-aor
; Real fields Twilio's own official Asterisk configuration guide sets on every trunk endpoint
; (its own "trunk_defaults" wizard template) -- not optional polish, these are what make NAT'd
; media and DTMF actually work reliably against a real Twilio trunk:
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=rfc4733
direct_media=no
; from_domain: optional, not in Twilio's own official example, but a real, commonly-recommended
; practice so the From header carries your real Trunk domain rather than this box's bare IP --
; harmless either way, kept for clarity.
from_domain=__TWILIO_TRUNK_DOMAIN__

[twilio-identify]
type=identify
endpoint=twilio-endpoint
; --- Inbound: Twilio -> this box --- real, current signaling IP ranges, EVERY region (a call
; could arrive from any of Twilio's active gateways, not just your account's home region) --
; verified live against Twilio's own published list, 2026-09-05:
; https://www.twilio.com/docs/sip-trunking/ip-addresses (their own docs note this list is
; "subject to change" -- re-check there if this deploy happens much later than the date above).
match=54.172.60.0/30    ; North America Virginia
match=54.244.51.0/30    ; North America Oregon
match=54.171.127.192/30 ; Europe Ireland
match=35.156.191.128/30 ; Europe Frankfurt
match=54.65.63.192/30   ; Asia-Pacific Tokyo
match=54.169.127.128/30 ; Asia-Pacific Singapore
match=54.252.254.64/30  ; Asia-Pacific Sydney
match=177.71.206.192/30 ; South America São Paulo

; --- Optional, real, easy hardening (not enabled): Credential List auth as defense-in-depth,
; matching what Twilio's own official Asterisk guide actually provisions alongside the ACL.
; To enable: create a Credential List in the Twilio Console (Termination -> Credential Lists),
; uncomment below, fill in the real username/password you set there, and add
; `outbound_auth=twilio-auth` to [twilio-endpoint] above.
;[twilio-auth]
;type=auth
;auth_type=userpass
;username=__TWILIO_CREDENTIAL_LIST_USERNAME__
;password=__TWILIO_CREDENTIAL_LIST_PASSWORD__
