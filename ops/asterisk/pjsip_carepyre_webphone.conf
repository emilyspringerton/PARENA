; pjsip_carepyre_webphone.conf — a real, dedicated WebRTC endpoint for the in-browser CarePyre
; SIP Phone (webphone.html, JsSIP over wss://). Founder direction, real-time: "lets pivot can you
; get the in-browser phone to work" — the native Android app's own signaling is correct and
; already verified (see docs/SIP_PHONE_ANDROID_NORTHSTAR.md Phase 2), but its raw UDP SIP/RTP
; path is blocked somewhere between the phone's own mobile network and this box (a firewall
; outside this box's own OS, confirmed clean via sudo-queue/61 — ufw inactive, iptables/nftables
; have no rule touching it). A browser softphone rides over wss:// on 443, the one port every
; mobile network and firewall already has to let through for HTTPS to work at all, so it
; sidesteps that whole class of problem.
;
; Deliberately a SEPARATE endpoint from extension 1000 (pjsip_carepyre_phone.conf), not a
; webrtc=yes flag bolted onto that same endpoint: `webrtc=yes` forces `media_encryption=dtls` +
; ICE + rtcp_mux, which the native Android app's own plain-RTP AudioCallSession.java does not
; (and should not need to) speak. Two endpoints, one dialplan ringing both (see
; extensions_carepyre.conf's own from-twilio context) — either the phone or the browser tab can
; answer an inbound call, and this doesn't touch or risk regressing the already-verified native
; path at all.
;
; SECRET: deployed by a real sudo-queue script (parallel to sudo-queue/52's own pattern for
; extension 1000), which generates a fresh password at deploy time and substitutes it in below —
; never hardcoded in this template file, never printed to this repo or this agent's own terminal.

[carepyre-webphone-auth]
type=auth
auth_type=userpass
username=1000web
password=__CAREPYRE_WEBPHONE_SECRET__

[carepyre-webphone-aor]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60

[1000web]
type=endpoint
context=carepyre-internal
disallow=all
; opus first: the real, standard, better-quality codec practically every modern browser's own
; WebRTC stack supports natively; ulaw kept as a real fallback for interop with the Twilio-leg
; codec (see pjsip_carepyre_phone.conf's own comment on why ulaw matters for that leg) since a
; call between this endpoint and the PSTN still needs a codec both ends actually share.
allow=opus,ulaw
auth=carepyre-webphone-auth
aors=carepyre-webphone-aor
; webrtc=yes: real, single-flag shorthand (per Asterisk's own res_pjsip endpoint docs) for
; rtcp_mux=yes, use_avpf=yes, ice_support=yes, use_received_transport=yes, media_encryption=dtls,
; dtls_verify=fingerprint, dtls_setup=actpass — every real requirement a browser's own WebRTC
; stack enforces unconditionally (a plain browser <-> Asterisk RTP stream with no DTLS-SRTP is
; not something any real browser will ever negotiate, this isn't optional hardening here).
webrtc=yes
; dtls_auto_generate_cert=yes: a real, ephemeral, self-signed DTLS certificate Asterisk generates
; and manages itself — the media layer's own DTLS handshake doesn't need to chain to a publicly
; trusted CA the way the signaling layer's wss:// TLS cert does (that one's the real, existing
; Let's Encrypt cert at /etc/letsencrypt/live/carepyre.org/, terminated by nginx, not by
; Asterisk); browsers don't validate the media DTLS cert against a trust store the way they do
; the page's own origin.
dtls_auto_generate_cert=yes
direct_media=no
