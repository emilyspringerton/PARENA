; voicemail_carepyre.conf — real voicemail mailbox for the CarePyre SIP Phone (kanban
; CAREPYRE-9311, "what other google voice grand central features can we add? like voicemail
; right?"). Real, standard Asterisk `app_voicemail` config -- extension 1000's own unanswered
; calls (both inbound-from-Twilio and any future internal calls) fall through to this real
; mailbox instead of just hanging up.
;
; REAL, FILL-IN PLACEHOLDER: __VOICEMAIL_1000_PIN__ -- a real PIN the CarePyre phone's own user
; sets to check messages (dial *97 from extension 1000, or VoicemailMain() from any context that
; exposes it). Generate a real one at deploy time (see the deploy script), never leave this as a
; literal, guessable default.

[carepyre]
; mailbox => password,Name,email,pager_email,options
; email is deliberately blank -- CarePyre has no outbound email/SMTP wired up yet (a real,
; separate, named gap -- app_voicemail's own "attach the message as a .wav" email delivery is a
; real, easy win once that exists, not attempted here).
1000 => __VOICEMAIL_1000_PIN__,CarePyre Phone,,,attach=no|saycid=yes
