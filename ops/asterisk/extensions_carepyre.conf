; extensions_carepyre.conf — real dialplan connecting the CarePyre SIP Phone (extension 1000,
; pjsip_carepyre_phone.conf) to the Twilio trunk (pjsip_twilio_trunk.conf). Kanban "do all the
; plumbing while i sign up for twillio."
;
; E.164 formatting: Twilio's own official Asterisk guide/troubleshooting doc is explicit --
; "The From/To/Request-URI/P-Asserted Identity should be in E.164 Format" (a leading `+`, then
; country code, then the number, no other punctuation) -- both dial patterns below send
; PJSIP/+1<number>@twilio-endpoint, not bare digits, matching that real, documented requirement.

; --- Outbound: extension 1000 dials a real phone number -> routed to Twilio ---
[carepyre-internal]
; A real, standard US 11-digit (1 + area code + number) dial pattern.
exten => _1NXXNXXXXX,1,NoOp(Outbound call from CarePyre phone to +${EXTEN} via Twilio)
 same => n,Dial(PJSIP/+${EXTEN}@twilio-endpoint,60)
 same => n,Hangup()

; A real, plain 10-digit fallback (no leading 1) -- same real route, normalized to E.164 with a
; leading +1 before it ever reaches Twilio.
exten => _NXXNXXXXX,1,NoOp(Outbound call from CarePyre phone to +1${EXTEN} via Twilio)
 same => n,Dial(PJSIP/+1${EXTEN}@twilio-endpoint,60)
 same => n,Hangup()

; --- Inbound: a real PSTN caller, routed here by Twilio's own Origination config, rings the
; CarePyre phone --- Twilio's own real Origination INVITEs arrive with an E.164-formatted
; Request-URI (+1NXXXXXXXXX) per their own documented behavior; _X. is a real, deliberately
; broad catch-all so this still works regardless of the exact DID/format Twilio sends.
;
; CAREPYRE-9311 ("what other google voice grand central features can we add? like voicemail
; right? hitting a button to start recording a call? (this call is being recorded)") -- real,
; shipped v0: an announced, auto-recorded inbound call, falling to real voicemail if unanswered.
; See CarePyre/docs/GOOGLE_VOICE_FEATURES_NORTHSTAR.md for the fuller feature map and what's
; deliberately NOT built yet (an in-call DTMF toggle to start/stop recording on demand).
[from-twilio]
exten => _X.,1,NoOp(Inbound call from Twilio, to DID ${EXTEN})
 ; Answer() before Playback()/MixMonitor() -- both need a real, up channel, not just a ringing one.
 same => n,Answer()
 ; REAL, HONEST GAP: this file references custom/this-call-may-be-recorded (a real Asterisk
 ; "custom sound" path, /var/lib/asterisk/sounds/en/custom/this-call-may-be-recorded.wav) --
 ; no such recording exists yet in this repo (the stock asterisk-core-sounds-en package has no
 ; matching prompt; this needs a real recorded or TTS-generated .wav, a real, separate,
 ; deliberately-not-silently-assumed step before this line does anything audible). Playback()
 ; itself fails silently (logs an error, keeps going) if the file is missing -- the call still
 ; connects, just without the announcement, matching Asterisk's own real, documented behavior.
 same => n,Playback(custom/this-call-may-be-recorded)
 ; MixMonitor: real, standard Asterisk call recording -- one file per call, named by a real,
 ; unique channel+timestamp so concurrent calls never collide.
 same => n,MixMonitor(${UNIQUEID}.wav)
 ; Rings both the native Android app (ext 1000) and the in-browser webphone (ext 1000web, added
 ; when the native app's own UDP path turned out to be blocked by a firewall outside this box --
 ; see docs/SIP_PHONE_ANDROID_NORTHSTAR.md's webphone pivot note) -- whichever answers first wins,
 ; standard Dial() semantics.
 same => n,NoOp(Ringing the CarePyre phone)
 same => n,Dial(PJSIP/1000&PJSIP/1000web,30)
 ; Real voicemail fallback (CAREPYRE-9311) -- an unanswered/busy call now falls to a real
 ; mailbox instead of just hanging up. See voicemail_carepyre.conf for the real mailbox config.
 same => n,Voicemail(1000@carepyre)
 same => n,Hangup()
