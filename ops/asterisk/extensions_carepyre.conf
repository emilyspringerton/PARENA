; extensions_carepyre.conf — real dialplan connecting the CarePyre SIP Phone (extension 1000,
; pjsip_carepyre_phone.conf) to the Twilio trunk (pjsip_twilio_trunk.conf). Kanban "do all the
; plumbing while i sign up for twillio."
;
; E.164 formatting: Twilio's own official Asterisk guide/troubleshooting doc is explicit --
; "The From/To/Request-URI/P-Asserted Identity should be in E.164 Format" (a leading `+`, then
; country code, then the number, no other punctuation) -- both dial patterns below send
; PJSIP/+1<number>@twilio-endpoint, not bare digits, matching that real, documented requirement.

; --- Outbound: extension 1000 dials a real phone number -> routed to Twilio ---
[carepyre-internal]
; A real, standard US 11-digit (1 + area code + number) dial pattern.
exten => _1NXXNXXXXX,1,NoOp(Outbound call from CarePyre phone to +${EXTEN} via Twilio)
 same => n,Dial(PJSIP/+${EXTEN}@twilio-endpoint,60)
 same => n,Hangup()

; A real, plain 10-digit fallback (no leading 1) -- same real route, normalized to E.164 with a
; leading +1 before it ever reaches Twilio.
exten => _NXXNXXXXX,1,NoOp(Outbound call from CarePyre phone to +1${EXTEN} via Twilio)
 same => n,Dial(PJSIP/+1${EXTEN}@twilio-endpoint,60)
 same => n,Hangup()

; --- Inbound: a real PSTN caller, routed here by Twilio's own Origination config, rings the
; CarePyre phone --- Twilio's own real Origination INVITEs arrive with an E.164-formatted
; Request-URI (+1NXXXXXXXXX) per their own documented behavior; _X. is a real, deliberately
; broad catch-all so this still works regardless of the exact DID/format Twilio sends.
[from-twilio]
exten => _X.,1,NoOp(Inbound call from Twilio, to DID ${EXTEN}, ringing the CarePyre phone)
 same => n,Dial(PJSIP/1000,30)
 ; Real, honest v0: no voicemail system is configured yet -- an unanswered call just ends
 ; cleanly rather than silently hanging or erroring. Voicemail is real, separate, named
 ; follow-up work, not assumed here.
 same => n,Hangup()
