; pjsip_carepyre_phone.conf — the CarePyre SIP Phone's own registered extension on this box's
; real, live Asterisk instance (kanban "do all the plumbing while i sign up for twillio"). Real,
; concrete PJSIP endpoint/auth/aor for extension 1000, the account any real SIP client
; registers as — a standard softphone (Zoiper, Linphone) today (CarePyre's own Android app has
; no native SIP registration wired in yet, see docs/SIP_PHONE_ANDROID_NORTHSTAR.md's own gap
; #2), and the real Android app itself once that native core lands.
;
; SECRET: deployed by sudo-queue/52-carepyre-asterisk-plumbing-deploy.sh, which generates a
; real, fresh password at deploy time and substitutes it in below (never hardcoded in this
; template file, never printed to this repo or this agent's own terminal).

[carepyre-phone-auth]
type=auth
auth_type=userpass
username=1000
password=__CAREPYRE_PHONE_SECRET__

[carepyre-phone-aor]
type=aor
max_contacts=1
remove_existing=yes
; qualify_frequency: real, periodic OPTIONS ping so Asterisk knows promptly if the phone drops
; off the network, instead of only finding out mid-call.
qualify_frequency=60

[1000]
type=endpoint
context=carepyre-internal
disallow=all
; ulaw first -- G.711 mu-law is Twilio's own recommended codec for trunking
; (docs/SIP_TWILIO_GATEWAY_NORTHSTAR.md's own already-researched finding), so the internal leg
; uses the same codec as the trunk leg -- no transcoding needed for a call bridged straight
; through.
allow=ulaw,alaw
auth=carepyre-phone-auth
aors=carepyre-phone-aor
; direct_media=no: keep RTP flowing through Asterisk itself rather than trying to bridge the
; phone directly to the Twilio trunk's own media IPs -- simpler, more reliable NAT behavior for
; a real client that may be behind a real home/mobile NAT, at the real, accepted cost of
; Asterisk relaying media itself (this box has real, checked headroom, see
; docs/PBX_ASTERISK_NORTHSTAR.md's own install-decision section).
direct_media=no
