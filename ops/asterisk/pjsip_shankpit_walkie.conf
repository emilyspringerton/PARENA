; pjsip_shankpit_walkie.conf — SHANKPIT walkie-talkie SIP endpoints on the same, real, already-
; live Asterisk instance CarePyre's own phone uses (founder real-time: "add walkie talkie voice
; coms asterisk based (we have a real asterisk server) parena powered"). Additive-only: a brand
; new, separate PJSIP context ("shankpit-walkie") and its own extension range (2999, 3000-3008,
; 3999, see extensions_shankpit_walkie.conf) -- never edits pjsip_carepyre_phone.conf/
; pjsip_twilio_trunk.conf, never shares an extension number with either.
;
; REAL, HONEST V0 SCOPE: no SHANKPIT game client can register here yet -- SHANKPIT's C client
; (packages/audio/audio.c) has zero microphone capture, codec, or SIP/RTP client code (see
; SHANKPIT/packages/simulation/walkie_talkie.h's own doc comment for the full account). This
; endpoint lets a real, standard SIP softphone (Zoiper, Linphone -- the same real clients
; CarePyre's own phone docs already reference) register and dial in, to test the real channel/
; ConfBridge plumbing itself ahead of any game-side voice work landing. One shared auth realm
; for v0 -- real per-player credentials/provisioning is a named, deliberate follow-up, not
; attempted here.
;
; SECRET: deployed by sudo-queue/90-shankpit-walkie-asterisk-deploy.sh, which generates a real,
; fresh password at deploy time and substitutes it in below (never hardcoded in this template
; file, never printed to this repo or this agent's own terminal) -- same real pattern
; pjsip_carepyre_phone.conf already established.

[shankpit-walkie-auth]
type=auth
auth_type=userpass
username=shankpit-walkie
password=__SHANKPIT_WALKIE_SECRET__

[shankpit-walkie-aor]
type=aor
; max_contacts=8: several softphones/future game clients can register under this one shared v0
; identity at once (each a distinct "contact" on the same AOR) -- real per-player AORs are the
; named follow-up above, not needed to prove the dialplan/ConfBridge plumbing itself.
max_contacts=8
remove_existing=no
qualify_frequency=60

[shankpit-walkie]
type=endpoint
context=shankpit-walkie
disallow=all
allow=ulaw,alaw
auth=shankpit-walkie-auth
aors=shankpit-walkie-aor
direct_media=no
