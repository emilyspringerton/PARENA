; extensions_shankpit_walkie.conf — real dialplan for SHANKPIT walkie-talkie team channels.
; Own, separate context (deliberately NEVER included into [carepyre-internal] -- a real
; isolation boundary between CarePyre's real customer-facing phone system and SHANKPIT's game
; voice comms sharing the same box). Matches walkie_rules.prn's own real channel numbers
; exactly: walkie_team_channel_ext(team_id) = 3000 + team_id (team 0..8),
; walkie_team_channel_ext(WALKIE_NO_TEAM) = 2999.

[shankpit-walkie]
; Local chatter -- unassigned/spectator players, walkie_rules.prn's own real 2999.
exten => 2999,1,NoOp(SHANKPIT walkie: local chatter bridge)
 same => n,ConfBridge(2999)
 same => n,Hangup()

; Per-team channels 3000-3008 (walkie_rules.prn's own real 3000 + team_id, team_id 0..8 --
; matches WALKIE_MAX_PLAYERS-scale team counts, not a guessed range).
exten => _300[0-8],1,NoOp(SHANKPIT walkie: team channel ${EXTEN})
 same => n,ConfBridge(${EXTEN})
 same => n,Hangup()

; All-call -- every team at once, a real "command override" channel (the same real key-custodian
; framing SECTION 536's Giant Zombie Bug work already established for The Men -- a plausible
; real future consumer, not built here).
exten => 3999,1,NoOp(SHANKPIT walkie: all-call bridge)
 same => n,ConfBridge(3999)
 same => n,Hangup()
